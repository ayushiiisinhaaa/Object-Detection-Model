[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detection-demo"
version = "0.1.0"
description = "YOLOv8 inference demo, API, and reproducible training utilities"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "gradio==5.44.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "python-multipart==0.0.20",
  "PyYAML==6.0.2",
  "torch==2.8.0",
  "ultralytics==8.3.191",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
